<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, monospace; color: var(--primary); }
  .time { font-size: 44px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 12px color-mix(in srgb, var(--primary) 70%, transparent); }
  .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15 } }
  .date { margin-top: 4px; font-size: 12px; letter-spacing: 3px; color: var(--on-surface-variant); text-transform: uppercase; }
  body.small .time { font-size: 26px; letter-spacing: 2px; }
  body.small .date { display: none; }
  body.large .time { font-size: 72px; }
</style>
</head>
<body>
  <div class="time"><span id="h">00</span><span class="colon">:</span><span id="m">00</span></div>
  <div class="date" id="d"></div>
<script>
  document.body.classList.add(window.mirmire.size);
  function tick() {
    const now = new Date();
    document.getElementById("h").textContent = String(now.getHours()).padStart(2, "0");
    document.getElementById("m").textContent = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("d").textContent = now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
