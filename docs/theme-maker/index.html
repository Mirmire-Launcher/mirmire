<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirmire Theme Studio</title>
  <meta name="description" content="Design themes and console icon packs for Mirmire, the retro game launcher for Android, with a live preview of the app's screens.">
  <link rel="icon" href="assets/mirmire-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand" href="../" title="Back to the Mirmire site"><img class="mark" src="assets/mirmire-icon.svg" alt="" width="34" height="34">Mirmire <small>Theme Studio</small></a>
      <div class="seg" id="mode" role="tablist" aria-label="What you're making">
        <button data-mode="theme" class="on">Theme</button>
        <button data-mode="icons">Icon pack</button>
        <button data-mode="plugin">Plugin</button>
      </div>
      <span class="hide-sm" id="title" style="color:var(--ink-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <span class="spacer"></span>
      <a class="btn ghost small hide-sm" href="../CREATING.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0-2 2z"/><path d="M5 19a2 2 0 0 0 2 2h12v-4"/></svg>Guide</a>
      <a class="iconbtn" href="https://github.com/Mirmire-Launcher/mirmire" target="_blank" rel="noopener" title="Mirmire on GitHub" aria-label="Mirmire on GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      <button class="iconbtn" id="themeBtn" title="Light or dark page" aria-label="Light or dark page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></button>
      <button class="btn small" id="newBtn">Open</button>
      <button class="btn primary small" id="downloadTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg>Download ZIP</button>
    </header>

    <div class="work">
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <section class="editor" id="editor" aria-label="Editor"></section>
      <section class="stage" aria-label="Live preview">
        <div class="stagetop">
          <div class="stagebar">
            <span class="barlabel">Screen</span>
            <div class="seg" id="scenes"></div>
            <span class="spacer"></span>
            <div class="toolset" role="group" aria-label="Preview tools">
              <button class="btn small" id="pickBtn" title="Click part of the preview to edit its color">Pick</button>
              <button class="btn small on" id="soundBtn" title="Navigation sounds">Sounds</button>
              <button class="btn small" id="musicBtn" title="Play the theme's music">Music</button>
            </div>
          </div>
          <div class="stagebar viewopts">
            <label class="opt"><span>Device</span><select class="input" id="frame" aria-label="Frame"><option value="device">Handheld</option><option value="flat">Screen only</option><option value="dual">Dual screen</option></select></label>
            <label class="opt"><span>Size</span><select class="input" id="screenSize" aria-label="Screen"></select></label>
            <label class="opt"><span>Buttons</span><select class="input" id="glyphs" aria-label="Controller buttons" title="Which controller's buttons the hints show. Matches Settings › Controls in the app."></select></label>
          </div>
        </div>
        <div class="viewport" id="viewport">
          <div class="device hh" id="device">
            <div class="grip l"><span class="well"><span class="stick"></span></span><span class="dpad"><i></i><i></i><i></i></span><span class="hh-sys"><i></i></span><span class="grille"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div><div class="grip r"><span class="face"><b>Y</b><b>X</b><b>B</b><b>A</b></span><span class="well"><span class="stick"></span></span><span class="hh-sys"><i></i></span><span class="grille"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
            <div class="screen" id="screen" tabindex="0" aria-label="Preview. Use the arrow keys, Enter and Escape."><div class="screen-inner" id="screenInner"></div></div>
            <div class="screen screen2" id="screen2" aria-label="Second screen preview"><div class="screen-inner" id="screen2Inner"></div></div>
          </div>
        </div>
        <div class="stagefoot">
          <div class="paletteStrip" id="strip"></div>
          <div class="checks" id="checks"></div>
          <span class="tip">Arrow keys move · Enter opens · Esc goes back · Q / E switch tabs</span>
        </div>
      </section>
    </div>
  </div>

  <div class="start hidden" id="start"></div>
  <div class="dropzone hidden" id="dropzone"><div>Drop to add<small>A theme or icon pack ZIP, a folder, or loose images, videos and sounds. They're sorted by name.</small></div></div>
  <div class="toast hidden" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
