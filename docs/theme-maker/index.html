<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirmire Theme Studio</title>
  <meta name="description" content="Design themes and console icon packs for Mirmire, the retro game launcher for Android, with a live preview of the app's screens.">
  <link rel="icon" href="assets/mirmire-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand"><img class="mark" src="assets/mirmire-icon.svg" alt="" width="32" height="32">Mirmire <small>Theme Studio</small></div>
      <div class="seg" id="mode" role="tablist" aria-label="What you're making">
        <button data-mode="theme" class="on">Theme</button>
        <button data-mode="icons">Icon pack</button>
      </div>
      <span class="hide-sm" id="title" style="color:var(--ink-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <span class="spacer"></span>
      <a class="btn ghost small hide-sm" href="https://github.com/Mirmire-Launcher/mirmire/blob/main/docs/CREATING.md" target="_blank" rel="noopener">Guide</a>
      <button class="iconbtn" id="themeBtn" title="Light or dark page"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></button>
      <button class="btn small" id="newBtn">Open</button>
      <button class="btn primary small" id="downloadTop"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Download ZIP</button>
    </header>

    <div class="work">
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <section class="editor" id="editor" aria-label="Editor"></section>
      <section class="stage" aria-label="Live preview">
        <div class="stagebar">
          <div class="seg" id="scenes"></div>
          <span class="spacer"></span>
          <button class="btn small" id="pickBtn" title="Click part of the preview to edit its color">Pick</button>
          <button class="btn small on" id="soundBtn" title="Navigation sounds">Sounds</button>
          <button class="btn small" id="musicBtn" title="Play the theme's music">Music</button>
          <select class="input" id="glyphs" style="width:auto;padding:6px 8px" aria-label="Controller buttons" title="Which controller's buttons the hints show. Matches Settings › Controls in the app."></select>
          <select class="input" id="screenSize" style="width:auto;padding:6px 8px" aria-label="Screen"></select>
          <select class="input" id="frame" style="width:auto;padding:6px 8px" aria-label="Frame"><option value="device">Handheld</option><option value="flat">Screen only</option></select>
        </div>
        <div class="viewport" id="viewport">
          <div class="device" id="device">
            <i class="stick l"></i><i class="stick r"></i><i class="dpad"></i><span class="btns"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <div class="screen" id="screen" tabindex="0" aria-label="Preview. Use the arrow keys, Enter and Escape."><div class="screen-inner" id="screenInner"></div></div>
          </div>
        </div>
        <div class="stagefoot">
          <div class="paletteStrip" id="strip"></div>
          <div class="checks" id="checks"></div>
          <span class="tip">Arrow keys move · Enter opens · Esc goes back · Q / E switch tabs</span>
        </div>
      </section>
    </div>
  </div>

  <div class="start hidden" id="start"></div>
  <div class="dropzone hidden" id="dropzone"><div>Drop to add<small>A theme or icon pack ZIP, a folder, or loose images, videos and sounds. They're sorted by name.</small></div></div>
  <div class="toast hidden" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
